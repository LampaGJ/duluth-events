name: Build & deploy feeds

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
    # TEMPORARY — Excalibur Con (DECC, 2026-08-15/16). A convention schedule is edited right up to
    # and during the event (rooms move, panels get added), and the Eventeny source is re-read whole
    # on every build, so hourly refresh is how a same-day change reaches subscribers. The 6h cadence
    # above would ship a schedule up to six hours stale during the con itself.
    # REVERT after 2026-08-17: delete this one cron line. Tracked by issue #6.
    - cron: "0 * * * *" # hourly, through the convention weekend
  workflow_dispatch: {} # manual "Run workflow" button
  push:
    branches: [main]

# Least-privilege; Pages deploy needs pages:write + id-token:write.
permissions:
  contents: read
  pages: write
  id-token: write

# SELF-HEALING BY DESIGN — do not flip this back to `false` without reading why.
#
# GitHub's Pages starter workflow ships `cancel-in-progress: false` so a deployment is never
# interrupted mid-flight. That cost us three days: on 2026-08-10 a scheduled run sat in `queued`
# for two and a half days without ever being assigned a runner, holding this group. Every later run
# piled up behind it and was cancelled by the next one — 10 cancellations in 20 runs, and the live
# site quietly served a stale build the whole time. A cancelled run is not a failed run, so nothing
# alerted. It took a manual `gh run cancel` on the stuck head to drain the queue.
#
# `true` makes a newer run supersede a stuck older one, so that jam cannot recur unattended. The
# trade is real but small here: this build regenerates `public/` wholesale from source, so a
# superseded run loses no work, and the next run redeploys within the hour.
#
# Diagnosing a suspected jam: `gh api 'repos/LampaGJ/duluth-events/actions/runs?status=queued'` —
# a `created_at` older than ~20 minutes IS the jam.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Headless Chromium for the JSON-LD (PDD) source. Datacenter IPs may be more
      # bot-suspect than a residential IP — if a headless source flakes here, the run
      # still succeeds and simply omits it (adapters fail soft, per pipeline.ts).
      - run: npx playwright install --with-deps chromium
      # Spec §347: the merge-count bound (and everything else — typecheck, dedupe/place-registry
      # unit tests) must fail CI instead of quietly shipping. Runs before the build step so a
      # failing gate blocks the deploy rather than shipping alongside it.
      - run: npx tsc --noEmit
      - run: npx vitest run
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build:feeds
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional: a residential render/anti-bot proxy so the Cloudflare-gated source (PDD)
          # works from CI's datacenter IP. URL template ending in `url=` (or containing {url}).
          # Set repo secret SCRAPER_PROXY to enable; unset -> falls back to headless (PDD=0 in CI).
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
